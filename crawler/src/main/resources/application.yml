spring:
  application:
    name: sportspub-crawler
  datasource:
    url: jdbc:postgresql://localhost:5432/sportspub_db
    username: sportspub
    password: sportspub
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

crawler:
  provider: playwright
  schedule:
    cron: "0 0 2 * * *"   # 매일 새벽 2시
