# /etc/nginx/sites-available/sportspub.conf
# 활성화: ln -s /etc/nginx/sites-available/sportspub.conf /etc/nginx/sites-enabled/
#
# 단계 1) HTTP 만으로 부팅 + certbot 발급 후
# 단계 2) certbot --nginx -d <DOMAIN> 실행하면 아래 server 블록을 certbot 이
#         자동으로 443 redirect + ssl_certificate 추가 형태로 갱신해준다.

upstream sportspub_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name <YOUR_DOMAIN>;  # 예: swyp-pub.duckdns.org

    # certbot HTTP-01 challenge 용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 10m;

    location / {
        proxy_pass http://sportspub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
